name: Test Census Monkey Typewriter Analyses

on:
  push:
    branches: [ master ]
    paths: 
      - 'content/analyses/**'
      - 'static/analyses/**'
      - 'scripts/**'
  pull_request:
    branches: [ master ]
    paths: 
      - 'content/analyses/**'
      - 'static/analyses/**'
      - 'scripts/**'

jobs:
  test-analyses:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5'
        
    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
      
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.148.1'
        extended: true
    
    - name: Install R dependencies
      run: |
        install.packages(c(
          "blogdown", "tidyverse", "tidycensus", "sf", "viridis", 
          "scales", "knitr", "kableExtra", "ggrepel", "fixest",
          "yaml", "rmarkdown", "httr", "xml2", "rvest"
        ), repos = "https://cloud.r-project.org/")
      shell: Rscript {0}
    
    - name: Make scripts executable
      run: chmod +x scripts/*.R
    
    - name: Run pre-deployment validation
      run: |
        for rmd_file in content/analyses/*.Rmd; do
          if [ -f "$rmd_file" ]; then
            echo "Validating $rmd_file"
            Rscript scripts/validate_analysis.R "$rmd_file"
          fi
        done
      
    - name: Run build tests
      run: Rscript scripts/test_build.R
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-output
        path: |
          public/
          content/analyses/*.html
          content/analyses/*_files/
        retention-days: 5
        
    - name: Verify deployment (post-deploy only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        # Wait for deployment to complete (adjust timing as needed)
        sleep 60
        Rscript scripts/verify_deployment.R
      continue-on-error: true
      
    - name: Comment on PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Census Monkey Typewriter analysis tests passed! All R Markdown files validated and built successfully.'
          })